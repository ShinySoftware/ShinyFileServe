name: Release

# Push a tag like v1.2.0 to build and publish a GitHub release: the macOS app (signed and notarized), a Windows
# installer and .deb/.rpm packages for Linux, for x64 and arm64 wherever the platform has both. Each platform builds
# on its own runner; the last job checksums everything and publishes it as one release, which is what the app's own
# update check reads.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0) - creates the v<version> tag'
        required: true

permissions:
  contents: write

env:
  # The workload set whose macos SDK (27.0) builds with Xcode 27.
  WORKLOAD_VERSION: 10.0.402.1
  DOTNET_VERSION: 10.0.4xx
  PROJECT: heads/ShinyFileServe.MacOS/ShinyFileServe.MacOS.csproj
  WINDOWS_PROJECT: heads/ShinyFileServe.Windows/ShinyFileServe.Windows.csproj
  LINUX_PROJECT: heads/ShinyFileServe.Linux/ShinyFileServe.Linux.csproj
  NFPM_VERSION: 2.48.0
  APP_PATH: heads/ShinyFileServe.MacOS/bin/Release/net10.0-macos/osx-arm64/FileServe.app

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # CFBundleShortVersionString only allows up to three integers, so a v1.2.0-beta1 tag stamps the app 1.2.0.
          APP_VERSION="${VERSION%%-*}"
          if ! [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag version '$VERSION' must look like 1.2.3 or 1.2.3-suffix"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$APP_VERSION" ]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

  macos:
    needs: version
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      # The workload set's macOS SDK (27.0.10742) needs Xcode 27.1 exactly: the runner defaults to 27.0, and the
      # newest it has (a 27.2 beta) is refused too. Bump this with WORKLOAD_VERSION.
      - name: Xcode
        run: |
          XCODE=/Applications/Xcode_27.1.app
          if [ ! -d "$XCODE" ]; then ls -d /Applications/Xcode*.app; echo "No $XCODE on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Workloads
        run: dotnet workload install macos maui --version "$WORKLOAD_VERSION"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_MACOS_DIRECT_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_MACOS_DIRECT_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Publish, not build: Release runs the IL trimmer, which is what ships. Without -o, which splits the bundle,
      # and with CreatePackage=false so the output is the .app rather than a .pkg installer. Version is the whole tag,
      # suffix and all: it is what the app compares against GitHub releases to know whether it is out of date.
      - name: Build
        run: >
          dotnet publish "$PROJECT" -c Release -f net10.0-macos
          -p:CreatePackage=false
          -p:CodesignKey="$SIGNING_IDENTITY"
          -p:Version="$VERSION"
          -p:ApplicationDisplayVersion="$APP_VERSION"
          -p:ApplicationVersion="${{ github.run_number }}"

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize
        env:
          API_KEY_P8: ${{ secrets.APPLE_MY_IDENTITY_P8_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_MY_IDENTITY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_MY_IDENTITY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # Accept the .p8 either as its PEM text or base64-encoded.
          if [[ "$API_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$API_KEY_P8" > "$KEY"
          else
            echo "$API_KEY_P8" | base64 --decode > "$KEY"
          fi

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"

          STATUS="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" \
              --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
            exit 1
          fi
          rm "$KEY"

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      # The app finds its own update by name: FileServe-<version>-macos-arm64.zip,
      # FileServe-<version>-windows-<arch>-setup.exe, FileServe-<version>-linux-<arch>.deb.
      - name: Package
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent "$APP_PATH" "artifacts/FileServe-$VERSION-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Workloads
        run: dotnet workload install maui-windows --version "$env:WORKLOAD_VERSION"

      # Self-contained - .NET and the Windows App SDK both - so nobody has to install a runtime first. Unsigned for
      # now: SmartScreen warns about an unknown publisher until there is a certificate to sign with.
      - name: Build
        run: |
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish "$env:WINDOWS_PROJECT" -c Release -f net10.0-windows10.0.19041.0 -r "win-$arch" `
              --self-contained `
              -p:WindowsAppSDKSelfContained=true `
              -p:Version="$env:VERSION" `
              -p:ApplicationDisplayVersion="$env:APP_VERSION" `
              -p:ApplicationVersion="${{ github.run_number }}" `
              -o "publish/win-$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            & $iscc.FullName "/DAppVersion=$env:VERSION" "/DFileVersion=$env:APP_VERSION" "/DArch=$arch" `
              "/DSourceDir=$PWD\publish\win-$arch" "/DOutputDir=$PWD\artifacts" installers\windows\FileServe.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # UseMaui needs a MAUI workload to import the MAUI SDK targets, and on Linux the SDK only offers the Tizen one.
      # Nothing here targets Tizen - it is only how the GTK4 head gets the same build targets every other head has.
      - name: Workloads
        run: dotnet workload install maui-tizen --version "$WORKLOAD_VERSION"

      # Both architectures from one runner: the app is managed code over GTK, which it loads from the system at run
      # time, so an arm64 publish only needs the arm64 runtime pack.
      - name: Build
        run: |
          for arch in x64 arm64; do
            dotnet publish "$LINUX_PROJECT" -c Release -r "linux-$arch" --self-contained \
              -p:Version="$VERSION" \
              -p:ApplicationDisplayVersion="$APP_VERSION" \
              -p:ApplicationVersion="${{ github.run_number }}" \
              -o "publish/linux-$arch"
          done

      - name: nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -p checksums.txt
          grep " nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # nfpm takes Debian's architecture names and maps them to x86_64/aarch64 for the .rpm.
      - name: Package
        run: |
          mkdir -p artifacts
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then ARCH=amd64; else ARCH=arm64; fi
            VERSION="$VERSION" ARCH="$ARCH" PUBLISH_DIR="publish/linux-$arch" \
              envsubst < installers/linux/nfpm.yaml > "$RUNNER_TEMP/nfpm-$arch.yaml"
            for format in deb rpm; do
              nfpm package -f "$RUNNER_TEMP/nfpm-$arch.yaml" -p "$format" -t "artifacts/FileServe-$VERSION-linux-$arch.$format"
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [ version, macos, windows, linux ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The app checks every download it installs against this file - for the unsigned Windows installer it is the
      # only check there is - so it covers every file in the release.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" artifacts/*
          --repo "${{ github.repository }}"
          --title "FileServe $VERSION"
          --generate-notes
          --target "$GITHUB_SHA"
          $PRERELEASE
