name: Site

# Publishes the product site in site/ to GitHub Pages. The screenshots and the app icon are copied in from where the
# app keeps them, so the README and the site never drift apart.
on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'src/ShinyFileServe.App/Resources/AppIcon/appicon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/screenshots _site/screenshots
          cp src/ShinyFileServe.App/Resources/AppIcon/appicon.svg _site/icon.svg
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
