# The .deb and .rpm for the GTK4 head. Run from the repository root after publishing, with
# envsubst filling in VERSION, ARCH (amd64 or arm64) and PUBLISH_DIR - see the release workflow.
#
# The app is self-contained, so .NET itself is in PUBLISH_DIR. What the package depends on is what
# it cannot carry: GTK and WebKitGTK, which the GTK4 backend loads by their versioned sonames
# (libgtk-4.so.1, libwebkitgtk-6.0.so.4), plus the tray icon, notifications and the keyring.
name: fileserve
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: net
priority: optional
maintainer: Shiny Software
vendor: Shiny Software
homepage: https://github.com/ShinySoftware/ShinyFileServe
license: Proprietary
description: |
  A self-hosted file server for a team, with a browser portal, a private NuGet feed and an npm
  registry. Runs from the system tray.

contents:
  - src: ${PUBLISH_DIR}
    dst: /opt/fileserve
    type: tree

  - src: /opt/fileserve/ShinyFileServe.Linux
    dst: /usr/bin/fileserve
    type: symlink

  - src: installers/linux/net.shinylib.fileserve.desktop
    dst: /usr/share/applications/net.shinylib.fileserve.desktop

  - src: src/ShinyFileServe.App/Resources/AppIcon/appicon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/net.shinylib.fileserve.svg

scripts:
  postinstall: installers/linux/after-change.sh
  postremove: installers/linux/after-change.sh

overrides:
  deb:
    # Alternatives cover the t64 renames (Ubuntu 24.04+) and each ICU a supported release ships.
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
      - libgtk-3-0t64 | libgtk-3-0
      - libayatana-appindicator3-1
      - libnotify4
      - libsecret-1-0
      - libx11-6
      - libssl3t64 | libssl3
      - libicu78 | libicu77 | libicu76 | libicu74 | libicu72
      - libstdc++6
      - ca-certificates
    recommends:
      - clamav-daemon
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - gtk3
      - libayatana-appindicator-gtk3
      - libnotify
      - libsecret
      - libX11
      - openssl-libs
      - libicu
      - libstdc++
      - ca-certificates
