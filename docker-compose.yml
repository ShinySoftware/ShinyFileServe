# FileServe, built from this repository and run. Made for a git-driven compose deployment such as
# Dockhand: point it at this file and it clones, builds and starts it - no registry involved.
#
#   docker compose up -d          (locally, the same thing)
#
# Then open http://<host>:8746 and create the administrator with the setup code from the log:
#   docker logs fileserve
#
# Every ${...} below can be set as a stack variable in Dockhand (or in a .env beside this file)
# rather than by editing this file. The defaults suit Unraid.
services:
  fileserve:
    build:
      context: .
      args:
        VERSION: ${FILESERVE_VERSION:-1.0.0}
    image: fileserve:local
    # Build from the checked-out source on every deploy, whatever flags the deployer passes to
    # "compose up". Unchanged layers come from the build cache, so a deploy with no code change is quick.
    pull_policy: build
    container_name: fileserve
    restart: unless-stopped
    ports:
      - "${FILESERVE_HTTP_PORT:-8746}:8080"
    environment:
      PUID: ${PUID:-99}                 # owner of everything FileServe writes - Unraid's nobody
      PGID: ${PGID:-100}                # Unraid's users group
      UMASK: ${UMASK:-002}              # group-writable, so SMB users in that group can edit uploads
      TZ: ${TZ:-America/Toronto}
      # DNS names people type to reach it, comma separated. IP addresses always work.
      FILESERVE_ALLOWED_HOSTS: ${FILESERVE_ALLOWED_HOSTS:-tower,tower.local}
      # host:port of a clamd to scan uploads with. Empty is off.
      FILESERVE_CLAMD: ${FILESERVE_CLAMD:-}
    volumes:
      # Absolute host paths on purpose: a relative one would land inside the deployer's clone of this
      # repository, and go wherever that goes.
      # Database, cookie key, NuGet/npm packages, partial uploads. Back this up.
      - ${FILESERVE_DATA_PATH:-/mnt/user/appdata/fileserve}:/data
      # The files to share - publish this folder, or folders inside it, from the portal.
      - ${FILESERVE_SHARES_PATH:-/mnt/user/files}:/shares
